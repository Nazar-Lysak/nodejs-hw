services:
  mongo:
    image: mongo:7
    container_name: nodejs-hw-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-mongo_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-mongo_password}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: